<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MINH ANH CLOTHING | Thời Trang Hàn Quốc</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
          },
          colors: {
            primary: '#18181b',
            accent: '#e11d48',
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #faf9f6;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      color: #27272a;
      -webkit-tap-highlight-color: transparent;
    }
    img { display: block; max-width: 100%; height: auto; }
    button, input, select, textarea { font-family: inherit; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #f4f4f5; }
    ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }

    .smooth-scroll { -webkit-overflow-scrolling: touch; }
    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
      50% { transform: scale(1.05); box-shadow: 0 6px 20px rgba(225,29,72,0.3); }
    }
    .widget-pulse {
      animation: pulseGlow 2.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-[#faf9f6] text-neutral-800 antialiased selection:bg-neutral-900 selection:text-white">

  <!-- ================= TOP NOTIFICATION BAR ================= -->
  <div class="bg-neutral-950 text-white text-[11px] font-medium py-1.5 px-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2 overflow-hidden text-ellipsis whitespace-nowrap">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="topBarMessage">Hỗ trợ giao hàng toàn Hàn Quốc • Đổi size miễn phí trong 3 ngày</span>
      </div>
      <div class="flex items-center space-x-3 shrink-0">
        <!-- Đa ngôn ngữ -->
        <div class="flex items-center space-x-1 bg-neutral-800/80 rounded px-1.5 py-0.5 border border-neutral-700">
          <button onclick="changeLanguage('vi')" id="langBtn-vi" class="px-1 text-[10px] font-bold text-white">VI</button>
          <span class="text-neutral-500 text-[10px]">|</span>
          <button onclick="changeLanguage('ko')" id="langBtn-ko" class="px-1 text-[10px] text-neutral-400 hover:text-white">KO</button>
          <span class="text-neutral-500 text-[10px]">|</span>
          <button onclick="changeLanguage('en')" id="langBtn-en" class="px-1 text-[10px] text-neutral-400 hover:text-white">EN</button>
        </div>

        <!-- Ổ khóa đăng nhập Quản Trị bí mật -->
        <button onclick="openLoginModal()" title="Khu vực Quản trị" class="p-1 text-neutral-400 hover:text-white transition">
          <i data-lucide="lock" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- ================= MAIN HEADER & NAVIGATION ================= -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-neutral-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 sm:h-20">
        
        <!-- Logo thương hiệu -->
        <div class="flex items-center space-x-3">
          <button onclick="filterCategory('ALL')" class="text-left group focus:outline-none">
            <span class="font-serif text-2xl sm:text-3xl font-bold tracking-tight text-neutral-900 group-hover:opacity-80 transition block">
              MINH ANH
            </span>
            <span class="text-[9px] uppercase tracking-widest text-neutral-400 font-semibold block -mt-1">
              Seoul • Modern Boutique
            </span>
          </button>
        </div>

        <!-- Danh mục trên máy tính -->
        <nav class="hidden md:flex items-center space-x-1 lg:space-x-2 text-sm font-medium">
          <button onclick="filterCategory('ALL')" id="nav-ALL" class="nav-btn px-3 py-1.5 rounded-full bg-neutral-900 text-white transition">Tất cả</button>
          <button onclick="filterCategory('Ao')" id="nav-Ao" class="nav-btn px-3 py-1.5 rounded-full text-neutral-600 hover:bg-neutral-100 transition">Áo & Hoodie</button>
          <button onclick="filterCategory('Quan')" id="nav-Quan" class="nav-btn px-3 py-1.5 rounded-full text-neutral-600 hover:bg-neutral-100 transition">Quần & Denim</button>
          <button onclick="filterCategory('Set')" id="nav-Set" class="nav-btn px-3 py-1.5 rounded-full text-neutral-600 hover:bg-neutral-100 transition">Set Thiết Kế</button>
          <button onclick="openSizeGuideModal()" class="px-3 py-1.5 rounded-full text-neutral-500 hover:text-neutral-900 transition flex items-center space-x-1 text-xs">
            <i data-lucide="ruler" class="w-3.5 h-3.5"></i>
            <span>Tư vấn Size</span>
          </button>
        </nav>

        <!-- Tiện ích bên phải (Tiền tệ, Tìm kiếm, Đồng bộ, Giỏ hàng) -->
        <div class="flex items-center space-x-2 sm:space-x-3">
          <!-- Chọn loại tiền tệ hiển thị -->
          <div class="relative">
            <select id="currencySelector" onchange="changeDisplayCurrency(this.value)" class="text-xs font-semibold bg-neutral-100 border border-neutral-300 rounded-lg px-2.5 py-1.5 pr-6 appearance-none focus:outline-none focus:ring-1 focus:ring-neutral-900 cursor-pointer">
              <option value="KRW">₩ KRW</option>
              <option value="VND">₫ VND</option>
              <option value="USD">$ USD</option>
            </select>
            <i data-lucide="chevron-down" class="w-3 h-3 text-neutral-500 absolute right-1.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          </div>

          <!-- Nút làm mới dữ liệu từ Đám mây -->
          <button onclick="syncDataFromFirebase(true)" title="Đồng bộ dữ liệu mới nhất từ đám mây" class="p-2 text-neutral-600 hover:text-neutral-900 hover:bg-neutral-100 rounded-full transition">
            <i data-lucide="refresh-cw" id="cloudSyncIcon" class="w-4 h-4"></i>
          </button>

          <!-- Tìm kiếm (Hiện ô tìm kiếm trên máy tính) -->
          <div class="hidden sm:flex items-center relative">
            <input type="text" id="desktopSearchInput" oninput="handleSearch(this.value)" placeholder="Tìm mẫu áo, quần..." class="text-xs bg-neutral-50 border border-neutral-200 rounded-full pl-8 pr-3 py-1.5 w-36 lg:w-48 focus:w-56 focus:outline-none focus:ring-1 focus:ring-neutral-900 transition-all">
            <i data-lucide="search" class="w-3.5 h-3.5 text-neutral-400 absolute left-2.5 top-1/2 -translate-y-1/2"></i>
          </div>

          <!-- Nút Giỏ Hàng -->
          <button onclick="toggleCartDrawer(true)" class="relative bg-neutral-900 text-white p-2 sm:px-3 sm:py-2 rounded-full flex items-center space-x-2 hover:bg-neutral-800 transition active:scale-95">
            <i data-lucide="shopping-bag" class="w-4 h-4"></i>
            <span class="text-xs font-semibold hidden sm:inline" id="cartBtnText">Giỏ hàng</span>
            <span id="cartCountBadge" class="bg-rose-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center -top-1 -right-1 sm:static">0</span>
          </button>
        </div>
      </div>

      <!-- Thanh danh mục cuộn ngang cho Mobile -->
      <div class="flex md:hidden overflow-x-auto space-x-1.5 py-2.5 border-t border-neutral-100 no-scrollbar text-xs font-medium">
        <button onclick="filterCategory('ALL')" class="nav-btn-mobile px-3 py-1 rounded-full bg-neutral-900 text-white shrink-0">Tất cả</button>
        <button onclick="filterCategory('Ao')" class="nav-btn-mobile px-3 py-1 rounded-full bg-neutral-100 text-neutral-700 shrink-0">Áo & Hoodie</button>
        <button onclick="filterCategory('Quan')" class="nav-btn-mobile px-3 py-1 rounded-full bg-neutral-100 text-neutral-700 shrink-0">Quần & Denim</button>
        <button onclick="filterCategory('Set')" class="nav-btn-mobile px-3 py-1 rounded-full bg-neutral-100 text-neutral-700 shrink-0">Set Thiết Kế</button>
        <button onclick="openSizeGuideModal()" class="px-3 py-1 rounded-full bg-neutral-100 text-neutral-500 shrink-0 flex items-center space-x-1">
          <i data-lucide="ruler" class="w-3 h-3"></i>
          <span>Size</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ================= BANNER THÔNG BÁO FLASH SALE TOÀN SÀN ================= -->
  <div id="storewideSaleBanner" class="hidden bg-gradient-to-r from-rose-600 via-rose-500 to-amber-600 text-white py-2 px-4 text-center shadow-inner">
    <div class="max-w-7xl mx-auto flex items-center justify-center space-x-2 text-xs sm:text-sm font-bold tracking-wide">
      <span class="bg-white text-rose-600 px-2 py-0.5 rounded text-[11px] uppercase">Flash Sale</span>
      <span id="storewideSaleText">Ưu đãi đặc biệt giảm 10% toàn bộ sản phẩm trên website!</span>
    </div>
  </div>

  <!-- ================= HERO INTRO SECTION ================= -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10">
    <div class="relative rounded-3xl overflow-hidden bg-neutral-900 text-white shadow-xl min-h-[220px] sm:min-h-[280px] flex items-center">
      <div class="absolute inset-0 opacity-40
